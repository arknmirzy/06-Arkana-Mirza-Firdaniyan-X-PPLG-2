name: Generate contribution snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23000000&color_dots=%23F0F0F0,%23D0D0D0,%23A0A0A0,%23606060,%23202020
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FFFFFF&color_dots=%231A1A1A,%23404040,%23707070,%23A0A0A0,%23D0D0D0

      - name: Publish animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
