name: Generate contribution snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: arknmirzy
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23000000&color_dots=%23F0F0F0,%23D0D0D0,%23A0A0A0,%23606060,%23202020
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FFFFFF&color_dots=%231A1A1A,%23404040,%23707070,%23A0A0A0,%23D0D0D0

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
